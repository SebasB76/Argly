# Argly en Docker. Demo completo:  docker compose up --build
#   Web -> http://localhost:5173      API -> http://localhost:8000/docs
#
# El backend arma la bandeja EN MEMORIA, así que Postgres es OPCIONAL.
# Para usar Postgres: descomenta DATABASE_URL en el servicio backend y
# arranca también db (docker compose up --build  ya lo levanta).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: argly-backend
    ports:
      - "8000:8000"
    environment:
      # Carga el agente de IA si defines llaves en un archivo .env (opcional).
      # DATABASE_URL: postgresql+psycopg2://argly:argly@db:5432/argly
      PYTHONUNBUFFERED: "1"
    env_file:
      - path: .env
        required: false
    volumes:
      # Hot-reload del código del backend.
      - ./src:/app/src
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: argly-frontend
    ports:
      - "5173:5173"
    environment:
      # Dentro de la red de compose el backend se llama "backend".
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    volumes:
      # HMR del front; node_modules se preserva con un volumen anónimo.
      - ./frontend:/app
      - /app/node_modules

  # Postgres OPCIONAL (no necesario para el demo).
  # No arranca por defecto; actívalo con:  docker compose --profile db up --build
  db:
    image: postgres:16
    container_name: argly-db
    profiles: ["db"]
    environment:
      POSTGRES_USER: argly
      POSTGRES_PASSWORD: argly
      POSTGRES_DB: argly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
